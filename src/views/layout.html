<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <link rel="icon" href="data:," />
  </head>
  <body class="bg-background font-body-base text-body-base text-on-surface">
    {{SPRITE}}

    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-[60] focus:rounded-lg focus:bg-primary focus:px-4 focus:py-2 focus:text-on-primary"
      >Skip to content</a
    >

    <aside
      class="fixed left-0 top-0 z-50 flex h-screen w-72 flex-col border-r border-outline-variant/30 bg-surface-container-lowest max-lg:hidden"
    >
      <div class="flex h-20 items-center px-8">
        <div class="flex items-center gap-3">
          <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary">
            <svg class="icon icon-sm text-on-primary"><use href="#i-spark" /></svg>
          </div>
          <span class="font-title-md text-title-md tracking-tight text-on-surface">WhatsApp Agent</span>
        </div>
      </div>

      <nav class="flex-1 space-y-8 overflow-y-auto px-4 py-4">
        <section>
          <p class="mb-2 px-4 font-label-caps text-label-caps uppercase tracking-widest text-on-surface-variant/60">
            Main
          </p>
          <div class="space-y-1">
            <a
              href="/"
              data-nav="connect"
              class="flex items-center gap-3 rounded-xl px-4 py-2.5 text-on-surface-variant transition-all duration-200 hover:bg-surface-container-low hover:text-on-surface"
            >
              <svg class="icon icon-sm"><use href="#i-grid" /></svg>
              <span class="font-body-sm text-body-sm">Connection</span>
            </a>
            <a
              href="/instructions"
              data-nav="instructions"
              class="flex items-center gap-3 rounded-xl px-4 py-2.5 text-on-surface-variant transition-all duration-200 hover:bg-surface-container-low hover:text-on-surface"
            >
              <svg class="icon icon-sm"><use href="#i-message" /></svg>
              <span class="font-body-sm text-body-sm">Instructions</span>
            </a>
            <a
              href="/outbound"
              data-nav="outbound"
              class="flex items-center gap-3 rounded-xl px-4 py-2.5 text-on-surface-variant transition-all duration-200 hover:bg-surface-container-low hover:text-on-surface"
            >
              <svg class="icon icon-sm"><use href="#i-chat" /></svg>
              <span class="font-body-sm text-body-sm">Outbound</span>
            </a>
          </div>
        </section>

        <section>
          <p class="mb-2 px-4 font-label-caps text-label-caps uppercase tracking-widest text-on-surface-variant/60">
            System
          </p>
          <div class="space-y-1">
            <a
              href="/team"
              data-nav="team"
              class="flex items-center gap-3 rounded-xl px-4 py-2.5 text-on-surface-variant transition-all duration-200 hover:bg-surface-container-low hover:text-on-surface"
            >
              <svg class="icon icon-sm"><use href="#i-user" /></svg>
              <span class="font-body-sm text-body-sm">Team</span>
            </a>
            <a
              href="/settings"
              data-nav="settings"
              class="flex items-center gap-3 rounded-xl px-4 py-2.5 text-on-surface-variant transition-all duration-200 hover:bg-surface-container-low hover:text-on-surface"
            >
              <svg class="icon icon-sm"><use href="#i-settings" /></svg>
              <span class="font-body-sm text-body-sm">Settings</span>
            </a>
          </div>
        </section>
      </nav>

      <div class="space-y-4 border-t border-outline-variant/30 p-6">
        <div class="flex items-center gap-3 px-2">
          <div class="flex h-8 w-8 items-center justify-center rounded-full bg-primary">
            <svg class="icon icon-sm text-on-primary"><use href="#i-phone" /></svg>
          </div>
          <div class="flex min-w-0 flex-col">
            <span class="truncate text-body-sm font-medium leading-none text-on-surface" data-bind="account-number">
              Not linked
            </span>
            <span class="mt-1 text-[11px] text-on-surface-variant" data-bind="account-state">Waiting for setup</span>
            <span class="mt-1 text-[11px] text-on-surface-variant/70" data-bind="signed-in-as"></span>
          </div>
        </div>
      </div>
    </aside>

    <div class="flex-1 lg:pl-72">
      <header
        class="fixed left-0 right-0 top-0 z-40 flex h-20 items-center justify-between gap-4 bg-background/80 px-margin-mobile backdrop-blur-md lg:left-72 lg:px-margin-desktop"
      >
        <nav class="flex items-center gap-1 lg:hidden">
          <a href="/" data-nav="connect" class="rounded-lg px-3 py-2 text-body-sm text-on-surface-variant">Connect</a>
          <a href="/outbound" data-nav="outbound" class="rounded-lg px-3 py-2 text-body-sm text-on-surface-variant">Outbound</a>
          <a href="/instructions" data-nav="instructions" class="rounded-lg px-3 py-2 text-body-sm text-on-surface-variant"
            >Instructions</a
          >
          <a href="/team" data-nav="team" class="rounded-lg px-3 py-2 text-body-sm text-on-surface-variant">Team</a>
          <a href="/settings" data-nav="settings" class="rounded-lg px-3 py-2 text-body-sm text-on-surface-variant"
            >Settings</a
          >
        </nav>
        <div class="flex flex-1 items-center justify-end gap-4">
          <div
            class="flex items-center gap-2 rounded-full bg-surface-container-lowest px-4 py-2 shadow-sm"
            title="WhatsApp connection"
          >
            <span class="h-2.5 w-2.5 rounded-full bg-outline-variant" data-bind="header-dot"></span>
            <span class="font-body-sm text-body-sm text-on-surface-variant" data-bind="header-state">Loading…</span>
          </div>
          <button
            type="button"
            data-action="logout"
            class="focusable flex items-center gap-2 rounded-full px-3 py-2 text-body-sm text-on-surface-variant transition-colors hover:bg-surface-container hover:text-on-surface"
          >
            <svg class="icon icon-sm"><use href="#i-logout" /></svg>
            <span class="max-sm:hidden">Sign out</span>
          </button>
        </div>
      </header>

      <main id="main" class="min-h-screen pt-20">{{CONTENT}}</main>
    </div>

    <div
      id="toast"
      hidden
      role="status"
      aria-live="polite"
      class="fixed bottom-8 left-1/2 z-[60] flex -translate-x-1/2 translate-y-8 items-center gap-2 rounded-full bg-inverse-surface px-6 py-3 font-title-md text-title-md text-inverse-on-surface opacity-0 shadow-xl transition-all duration-300"
    >
      <svg class="icon icon-sm" data-bind="toast-icon"><use href="#i-check-circle" /></svg>
      <span data-bind="toast-text"></span>
    </div>

    <script src="/assets/app.js"></script>
    <script src="/assets/{{SCRIPT}}"></script>
  </body>
</html>
